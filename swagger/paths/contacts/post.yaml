tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: 1234567890
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            type: string
            example: 62e8f9f5e4bc4b0015f3c1a3
          email:
            type: string
            example: mail@mail.com
          isFavorite:
            type: boolean
            example: true
          photo:
            type: string
            example: https://example.com/photo.jpg
responses:
  '201':
    description: Successful operation
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: OK
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
