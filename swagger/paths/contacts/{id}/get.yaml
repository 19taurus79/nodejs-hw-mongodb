tags:
  - Contacts

summary: Get contact by ID
operationId: getContactById
description: Get contact by ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: ID of contact to return
    required: true
    schema:
      type: string
      example: 62e8f9f5e4bc4b0015f3c1a3
responses:
  '200':
    description: Successful operation
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact found
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
