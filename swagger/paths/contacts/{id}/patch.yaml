tags:
  - Contacts

summary: Update contact by ID
operationId: updateContactById
description: Update contact by ID
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    description: ID of contact to update
    required: true
    schema:
      type: string
      example: 62e8f9f5e4bc4b0015f3c1a3
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - userId
        properties:
          name:
            type: string
            example: John Doe
          phoneNumber:
            type: string
            example: +1234567890
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
          # userId:
          #   type: string
          #   example: 62e8f9f5e4bc4b0015f3c1a3
          email:
            type: string
            example: 6Vt2J@example.com
          isFavorite:
            type: boolean
            example: true
          photo:
            type: binary
            example: https://example.com/photo.jpg
responses:
  '201':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact updated successfully
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
