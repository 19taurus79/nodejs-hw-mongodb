tags:
  - Contacts

summary: Get all contacts
operationId: getContacts
description: Get all contacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number
    required: false
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      example: 10
  - name: sortBy
    in: query
    description: Sort by field
    required: false
    schema:
      type: string
      example: name
  - name: sortOrder
    in: query
    description: Sort order
    required: false
    schema:
      type: string
      example: asc
  # - name: userId
  #   in: query
  #   description: User ID
  #   required: true
  #   schema:
  #     type: string
  #     example: 62e8f9f5e4bc4b0015f3c1a3
responses:
  '200':
    description: Successful operation
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: OK
            data:
              type: object
              required:
                - contacts
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 100
                totalPages:
                  type: integer
                  example: 10
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: '../../components/responses/401.yaml'
